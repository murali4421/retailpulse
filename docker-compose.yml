services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailpulse-backend
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      BACKEND_URL: ${BACKEND_URL:?Set BACKEND_URL in your environment or root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your environment or root .env file}
      ENCRYPTION_MASTER_KEY: ${ENCRYPTION_MASTER_KEY:?Set ENCRYPTION_MASTER_KEY in your environment or root .env file}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER in your environment or root .env file}
      AUTH0_ISSUER: ${AUTH0_ISSUER:?Set AUTH0_ISSUER in your environment or root .env file}
      OKTA_ISSUER: ${OKTA_ISSUER:?Set OKTA_ISSUER in your environment or root .env file}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in your environment or root .env file}
      FRONTEND_URL: ${FRONTEND_URL:?Set FRONTEND_URL in your environment or root .env file}
    volumes:
      - backend-data:/usr/src/app/src/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const url = process.env.BACKEND_URL || process.env.PUBLIC_BACKEND_URL; if (!url) process.exit(1); fetch(new URL('/api/health', url).toString()).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1));\""]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Configure the frontend from the environment rather than hardcoded URLs.
        VITE_API_URL: ${VITE_API_URL:?Set VITE_API_URL in your environment or root .env file}
        VITE_WS_URL: ${VITE_WS_URL:?Set VITE_WS_URL in your environment or root .env file}
        VITE_OKTA_ISSUER: ${VITE_OKTA_ISSUER:?Set VITE_OKTA_ISSUER in your environment or root .env file}
        VITE_AUTH0_ISSUER: ${VITE_AUTH0_ISSUER:?Set VITE_AUTH0_ISSUER in your environment or root .env file}
    container_name: retailpulse-frontend
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend

volumes:
  backend-data:
    driver: local #local
