services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: retailpulse-backend
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - JWT_SECRET=retailpulse-super-secret-jwt-key-2026
      - ENCRYPTION_MASTER_KEY=retailpulse-saas-enterprise-secure-key-2026-gdpr
    volumes:
      - backend-data:/usr/src/app/src/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: retailpulse-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  backend-data:
    driver: local
