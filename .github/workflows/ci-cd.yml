name: RetailPulse SaaS CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            backend/package.json
            frontend/package.json

      # Backend Verification
      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Backend Security & Syntax Check
        working-directory: ./backend
        run: node -e "import('./src/server.js').then(() => console.log('Backend syntax OK')).catch(e => { if (e.code === 'ERR_MODULE_NOT_FOUND') process.exit(1); })"

      # Frontend Verification
      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend TypeScript & Bundle Build
        working-directory: ./frontend
        run: npm run build

      # Docker Image Build Check
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: retailpulse-backend:test

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: retailpulse-frontend:test
